services:
  school-survey:
    build: .
    image: school-survey:latest
    container_name: school-survey
    restart: unless-stopped
    ports:
      # BIND_HOST=127.0.0.1 — когда приложение работает за nginx (продакшен).
      # BIND_HOST=0.0.0.0 — прямой доступ к порту 3000 (локальная разработка).
      - "${BIND_HOST:-0.0.0.0}:3000:3000"
    environment:
      - PORT=3000
      # Пароль администратора задаётся ТОЛЬКО при первом запуске (когда БД ещё пуста).
      # После первого входа смените его в разделе «Настройки» — переменная больше не влияет.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      # 1 — если за обратным прокси (nginx), чтобы корректно определять IP участников
      - TRUST_PROXY=${TRUST_PROXY:-0}
      # Дополнительная блокировка повторов по IP (по умолчанию выключена из-за общего NAT в школах)
      # - ENFORCE_IP=1
    volumes:
      - survey-data:/app/data

volumes:
  survey-data:
