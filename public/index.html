<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Школьные опросы</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/img/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <noscript><div style="padding:24px;font-family:sans-serif;text-align:center">Для работы приложения необходимо включить JavaScript.</div></noscript>
  <script>
    // Если JS-код падает до рендера — показываем ошибку на странице вместо пустого экрана.
    window.addEventListener('error', function (e) {
      var el = document.getElementById('app');
      if (el && el.innerHTML.trim() === '') {
        el.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#b91c1c">Ошибка загрузки: ' + (e.message || '') + '</div>';
      }
    });
  </script>
  <script src="/js/app.js"></script>
</body>
</html>
